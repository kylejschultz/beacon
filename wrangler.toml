name = "beacon"
main = "src/index.ts"
compatibility_date = "2025-05-07"
compatibility_flags = ["nodejs_compat"]

# Required secrets (set via `wrangler secret put <NAME>` before deploying):
#   STATS_SECRET - password for dashboard login and JWT signing key (never sent over the wire)
#   API_SECRET   - bearer token for machine-to-machine calls (e.g. GitHub Actions discord-stats workflow)

routes = [
  { pattern = "beacon.kjschultz.com", custom_domain = true }
]

[[d1_databases]]
binding = "ANALYTICS_DB"
database_name = "beacon-analytics"
database_id = "be31f52f-1b4a-4d36-9325-3a06e11d62f2"

[triggers]
crons = ["0 7 * * *"]

[observability.logs]
enabled = true
invocation_logs = true
